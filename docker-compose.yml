services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fin_app
      POSTGRES_PASSWORD: fin_app
      POSTGRES_DB: finanzas_personales
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file: ./backend/.env
    depends_on: 
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: